<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Stage Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #060b18;
            --surface: #111a2f;
            --surface-2: #182543;
            --border: #2f4166;
            --accent: #4ca5ff;
            --success: #18dc8f;
            --warning: #ffd43b;
            --danger: #ff5470;
            --text: #f5f8ff;
            --text-muted: #a9b6d2;
            --shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
        }

        body.light-mode {
            --bg: #f4f8ff;
            --surface: #ffffff;
            --surface-2: #eef4ff;
            --border: #c9d8f1;
            --accent: #2f80ed;
            --text: #101631;
            --text-muted: #4b5d84;
            --shadow: 0 12px 24px rgba(40, 76, 145, 0.12);
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top, #132447 0%, var(--bg) 50%, #03060f 100%);
            color: var(--text);
            display: flex;
            flex-direction: column;
            line-height: 1.3;
            overflow: hidden;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(8, 16, 32, 0.55);
            backdrop-filter: blur(8px);
        }

        .app-title {
            font-size: 22px;
            letter-spacing: 0.6px;
            font-weight: 700;
        }

        .badge-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .mode-badge {
            padding: 7px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: linear-gradient(145deg, var(--surface-2), var(--surface));
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .app-main {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
            align-items: start;
        }

        .card {
            background: linear-gradient(165deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01));
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .display-card {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .timer-display {
            font-size: clamp(86px, 13vw, 172px);
            font-family: 'Courier New', monospace;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
            color: var(--success);
            text-align: center;
            text-shadow: 0 0 40px rgba(24, 220, 143, 0.35);
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-display.warning {
            color: var(--warning);
            text-shadow: 0 0 45px rgba(255, 212, 59, 0.45);
        }

        .timer-display.critical {
            color: var(--danger);
            text-shadow: 0 0 48px rgba(255, 84, 112, 0.7);
            animation: pulse-critical 0.55s infinite;
        }

        @keyframes pulse-critical {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.58; }
        }

        .sub-metrics {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }

        .metric {
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            padding: 10px;
            text-align: center;
        }

        .metric-label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .progress-track {
            height: 10px;
            border-radius: 999px;
            border: 1px solid var(--border);
            overflow: hidden;
            background: rgba(0, 0, 0, 0.25);
        }

        .progress-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--success), #5be5ad);
            transition: width 0.2s ease;
        }

        .controls-stack {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .controls-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }

        .adjust-row {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        button {
            border: 1px solid var(--border);
            border-radius: 12px;
            background: linear-gradient(160deg, var(--surface-2), var(--surface));
            color: var(--text);
            padding: 13px 12px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.45px;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
            min-height: 46px;
        }

        button:hover {
            transform: translateY(-1px);
            border-color: var(--accent);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn-start {
            background: linear-gradient(160deg, #1ce79a, #14a86f);
            color: #081813;
            border-color: #24e39f;
        }

        .btn-pause {
            background: linear-gradient(160deg, #ffd95c, #f0b100);
            color: #221a05;
            border-color: #ffda70;
        }

        .btn-reset {
            background: linear-gradient(160deg, #ff7690, #e33958);
            border-color: #ff8ca2;
        }

        .presets {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .preset-btn {
            min-height: 38px;
            padding: 9px 14px;
            font-size: 12px;
            min-width: unset;
            border-radius: 999px;
        }

        .preset-btn.active {
            background: linear-gradient(160deg, #6ec1ff, #2f80ed);
            border-color: #89d1ff;
        }

        .settings-card {
            padding: 20px;
            display: grid;
            gap: 16px;
        }

        .settings-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .setting-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .setting-group label {
            font-size: 11px;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
        }

        input, select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px 14px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 17px;
            height: 17px;
            cursor: pointer;
        }

        .checkbox-item label {
            font-size: 14px;
            color: var(--text);
            cursor: pointer;
        }

        .counter-display {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }

        .counter-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
        }

        .counter-item label {
            display: block;
            font-size: 11px;
            margin-bottom: 7px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .counter-item input {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
        }

        .footer {
            padding: 9px 16px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            background: rgba(8, 16, 32, 0.4);
        }

        .hidden {
            display: none !important;
        }

        @keyframes flash {
            0%, 100% { background: transparent; }
            50% { background: rgba(255, 84, 112, 0.2); }
        }

        body.flashing::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: rgba(255, 84, 112, 0.15);
            animation: flash 0.3s;
            z-index: 20;
        }

        @media (max-width: 1180px) {
            .app-main {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 760px) {
            .app-header {
                padding: 12px;
            }
            .app-title {
                font-size: 18px;
            }
            .display-card {
                padding: 14px;
            }
            .controls-row {
                grid-template-columns: 1fr;
            }
            .adjust-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .sub-metrics {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <h1 class="app-title">⏱ Ultimate Stage Timer</h1>
        <div class="badge-row">
            <span class="mode-badge" id="modeLabel">COUNTDOWN</span>
            <span class="mode-badge" id="statusLabel" style="background: var(--warning);">READY</span>
        </div>
    </header>

    <main class="app-main">
        <section class="display-card card">
            <div class="timer-display" id="timerDisplay">00:00</div>

            <div class="sub-metrics">
                <div class="metric">
                    <span class="metric-label">Remaining</span>
                    <span class="metric-value" id="remainingValue">00:00</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Elapsed</span>
                    <span class="metric-value" id="elapsedValue">00:00</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Next Alert</span>
                    <span class="metric-value" id="nextAlertValue">1:00</span>
                </div>
            </div>

            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div id="counterDisplay" class="counter-display hidden">
                <div class="counter-item">
                    <label for="itemCounter">Items</label>
                    <input type="number" id="itemCounter" value="0" min="0">
                </div>
                <div class="counter-item">
                    <label for="voteCounter">Votes</label>
                    <input type="number" id="voteCounter" value="0" min="0">
                </div>
                <div class="counter-item">
                    <label for="tallyCounter">Tally</label>
                    <input type="number" id="tallyCounter" value="0" min="0">
                </div>
            </div>
        </section>

        <aside class="settings-card card">
            <h2 class="settings-title">Control Deck</h2>

            <div class="controls-stack">
                <div class="controls-row">
                    <button class="btn-start" id="startBtn" title="Space to start/pause">▶ Start</button>
                    <button class="btn-reset" id="resetBtn" title="R to reset">↺ Reset</button>
                    <button id="fullscreenBtn" title="F for fullscreen">⛶ Fullscreen</button>
                </div>

                <div class="controls-row">
                    <button id="lightModeBtn" title="L to toggle theme">🌙 Dark</button>
                    <button id="repeatLastBtn" title="Load last used setup">⟲ Repeat Last Setup</button>
                    <button id="clearStateBtn" title="Clear saved setup">✖ Clear Saved</button>
                </div>

                <div class="adjust-row" id="adjustRow">
                    <button class="adjust-btn" data-adjust="-60">−1:00</button>
                    <button class="adjust-btn" data-adjust="-10">−0:10</button>
                    <button class="adjust-btn" data-adjust="10">+0:10</button>
                    <button class="adjust-btn" data-adjust="60">+1:00</button>
                </div>

                <div class="presets" id="presetsContainer"></div>
            </div>

            <div class="setting-grid">
                <div class="setting-group">
                    <label for="timerMode">Timer Mode</label>
                    <select id="timerMode">
                        <option value="countdown">Countdown</option>
                        <option value="stopwatch">Stopwatch</option>
                        <option value="items">Item Counter</option>
                        <option value="votes">Vote Counter</option>
                        <option value="tally">Tally Counter</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label for="durationInput">Duration (MM:SS or HH:MM:SS)</label>
                    <input type="text" id="durationInput" placeholder="05:00" value="05:00">
                </div>

                <div class="setting-group">
                    <label for="warningLevel">Warning Level (sec)</label>
                    <input type="number" id="warningLevel" value="60" min="0">
                </div>

                <div class="setting-group">
                    <label for="criticalLevel">Critical Level (sec)</label>
                    <input type="number" id="criticalLevel" value="10" min="0">
                </div>
            </div>

            <div class="checkbox-grid">
                <div class="checkbox-item">
                    <input type="checkbox" id="colorWarning" checked>
                    <label for="colorWarning">Color warning</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="soundWarning" checked>
                    <label for="soundWarning">Sound effects</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="flashWarning" checked>
                    <label for="flashWarning">Screen flash</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="milestoneAlerts" checked>
                    <label for="milestoneAlerts">Milestone alerts</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="autoReset" >
                    <label for="autoReset">Auto reset at 00:00</label>
                </div>
            </div>
        </aside>
    </main>

    <footer class="footer">
        Space: Start/Pause | R: Reset | F: Fullscreen | L: Theme | 1-5: Presets | ESC: Exit Fullscreen
    </footer>

    <script src="app.js"></script>
</body>
</html>
